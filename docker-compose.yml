# Local Postgres for development. Matches the DATABASE_URL in .env.example.
#   docker compose up -d        # start
#   docker compose down         # stop (keeps data in the volume)
#   docker compose down -v      # stop + wipe data
services:
  db:
    image: postgres:16-alpine
    container_name: tavola-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tavola
      POSTGRES_PASSWORD: tavola
      POSTGRES_DB: tavola
    ports:
      - "5432:5432"
    volumes:
      - tavola-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavola -d tavola"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tavola-pgdata:
